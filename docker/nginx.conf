# docker/nginx.conf
# 🔹 Rate limiting для защиты от спама
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
limit_req_zone $binary_remote_addr zone=api_req:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # 🔒 WebSocket: макс 5 подключений с 1 IP
    location /ws {
        limit_conn ws_conn 5;
        limit_conn_status 429;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 🔒 REST API: макс 30 запросов/мин с 1 IP
    location /api {
        limit_req zone=api_req burst=5 nodelay;

        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 🌐 Лендинг (корень сайта)
    location / {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml;
        expires 1d;
    }

    # 🎮 Игра (SPA)
    location /game {
        alias /usr/share/nginx/html/client;
        try_files $uri $uri/ /index.html;
        expires 7d;
    }

    # 📊 Админка (SPA)
    location /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /index.html;
        expires 7d;
    }

    # 🛡 Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}