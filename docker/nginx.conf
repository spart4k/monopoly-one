# docker/nginx.conf
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
limit_req_zone $binary_remote_addr zone=api_req:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # 🔹 Порядок важен: специфичные локации ДО общих

    # 🔒 WebSocket
    location /ws {
        limit_conn ws_conn 5;
        limit_conn_status 429;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 🔒 REST API
    location /api {
        limit_req zone=api_req burst=5 nodelay;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 🎮 Игра (SPA)
    location /game {
        root /usr/share/nginx/html;
        index index.html;

        # 🔹 Убираем трейлинг слэш у файлов (но не у папок!)
        # Если запрос /game/file.css/ → редирект на /game/file.css
        rewrite ^/game/([^/]+\.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf|eot))/$ /game/$1 permanent;

        try_files $uri $uri/ /game/index.html;
        expires 7d;
        add_header Cache-Control "public, no-cache";
    }

    # 🔹 Ассеты игры: ТОЛЬКО файлы, без index, без autoindex
    location ~* ^/game/assets/ {
        root /usr/share/nginx/html;

        # 🔹 Запрещаем листинг папок и index
        autoindex off;

        # 🔹 Если кто-то запросил файл со слэшем в конце → редирект на файл без слэша
        rewrite ^/game/assets/([^/]+\.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf|eot))/$ /game/assets/$1 permanent;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 📊 Админка (SPA) — аналогично
    location /admin {
        root /usr/share/nginx/html;
        index index.html;
        rewrite ^/admin/([^/]+\.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf|eot))/$ /admin/$1 permanent;
        try_files $uri $uri/ /admin/index.html;
        expires 7d;
    }

    location ~* ^/admin/assets/ {
        root /usr/share/nginx/html;
        autoindex off;
        rewrite ^/admin/assets/([^/]+\.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf|eot))/$ /admin/assets/$1 permanent;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 🌐 Лендинг (корень)
    location / {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1d;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml;
    }

    # 🛡 Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}