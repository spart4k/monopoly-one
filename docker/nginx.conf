# docker/nginx.conf
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
limit_req_zone $binary_remote_addr zone=api_req:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # 🔹 Docker DNS resolver (для Alpine)
    resolver 127.0.0.11 valid=30s;

    # 🔒 WebSocket
    location /ws {
        limit_conn ws_conn 5;
        limit_conn_status 429;

        # 🔹 ИСПРАВЛЕНО: используй имя сервиса (не container_name!)
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 🔒 REST API
    location /api {
        limit_req zone=api_req burst=5 nodelay;

        # 🔹 ИСПРАВЛЕНО: то же имя сервиса
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 🌐 Лендинг
    location / {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml;
        expires 1d;
    }

    # 🎮 Игра
    # 🎮 Игра (SPA) — ИСПРАВЛЕНО
    location /game {
        root /usr/share/nginx/html;

        # 🔹 Фолбэк именно на /game/index.html (не на /index.html!)
        try_files $uri $uri/ /game/index.html;

        expires 7d;
    }

    # 🔹 Ассеты игры
    location /game/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 🌐 Лендинг (корень) — должен быть ПОСЛЕ /game
    location / {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1d;
    }

    # 📊 Админка (SPA) — ИСПРАВЛЕНО
    location /admin {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
        expires 7d;
    }

    # 🛡 Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}