# docker/nginx.conf
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
limit_req_zone $binary_remote_addr zone=api_req:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # 🔹 Порядок важен: специфичные локации ДО общих

    # 🔒 WebSocket
    location /ws {
        limit_conn ws_conn 5;
        limit_conn_status 429;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 🔒 REST API
    location /api {
        limit_req zone=api_req burst=5 nodelay;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 🎮 Игра (SPA) — 🔹 ИСПОЛЬЗУЕМ alias
    location /game {
        # 🔹 alias заменяет /game на путь к папке с билдом
        alias /usr/share/nginx/html/client;
        index index.html;

        # 🔹 Если файл не найден → отдаём index.html ИЗ ТОЙ ЖЕ ПАПКИ
        try_files $uri $uri/ /index.html;

        expires 7d;
        add_header Cache-Control "public, no-cache";
    }

    # 🔹 Ассеты игры (отдельный блок для кэширования)
    location ~* ^/game/assets/ {
        alias /usr/share/nginx/html/client/assets;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 📊 Админка (SPA) — аналогично
    location /admin {
        alias /usr/share/nginx/html/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 7d;
    }

    location ~* ^/admin/assets/ {
        alias /usr/share/nginx/html/admin/assets;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 🌐 Лендинг (корень) — используется root, т.к. это корневая папка
    location / {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1d;
    }

    # 🛡 Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}