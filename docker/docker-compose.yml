# docker/docker-compose.yml
version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: monopoly_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 🔹 Маунт собранных фронтендов (собираем локально, не на сервере!)
      - ../landing/.output/public:/usr/share/nginx/html/landing:ro
      - ../client/dist:/usr/share/nginx/html/client:ro
      - ../admin/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: monopoly_server
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://monopoly:SuperSecretPass123@postgres:5432/monopoly
      - JWT_SECRET=your-super-secure-jwt-secret-min-32-chars
      - CORS_ORIGIN=http://your-domain-or-ip.com  # ⚠️ Замени на свой домен/IP
    ports:
      - "3000:3000" # Оставь для отладки, потом можно убрать
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: monopoly_db
    environment:
      POSTGRES_DB: monopoly
      POSTGRES_USER: monopoly
      POSTGRES_PASSWORD: SuperSecretPass123
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monopoly"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data: