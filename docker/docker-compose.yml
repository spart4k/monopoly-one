# docker/docker-compose.yml (Production + build on server)
version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: monopoly_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 🔹 Маунт СОБРАННЫХ фронтендов (которые мы только что сделали)
      - ../landing/.output/public:/usr/share/nginx/html/landing:ro
      - ../client/dist:/usr/share/nginx/html/client:ro
      - ../admin/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks: [monopoly]

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: monopoly_server
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://monopoly:SuperSecretPass123@postgres:5432/monopoly
      - JWT_SECRET=your-super-secure-jwt-secret-min-32-chars
      - CORS_ORIGIN=http://твой_ip_или_домен
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [monopoly]

  postgres:
    image: postgres:15-alpine
    container_name: monopoly_db
    environment:
      POSTGRES_DB: monopoly
      POSTGRES_USER: monopoly
      POSTGRES_PASSWORD: SuperSecretPass123
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monopoly -d monopoly"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c max_connections=30
    restart: unless-stopped
    networks: [monopoly]

networks:
  monopoly:
    driver: bridge

volumes:
  pg_data: